<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstudeAqui</title>

    <link rel="shortcut icon" href="../img/logo_16x16.png" type="image/x-icon">
    <script src="../scripts/tema.js"></script>
    <link rel="stylesheet" href="../styles/materias.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../scripts/ProtejePages.js"></script>
</head>

<body>

    <div class="pagina">

        <header class="cabecalho">
            <div class="dentro-cabecalho">

                <div class="acoes">

                    <button id="alterartema" class="botao-icone" aria-label="Tema" type="button">
                        <i data-lucide="moon" style="width:18px; height:18px; stroke-width:1.75;"></i>
                    </button>

                    <a href="./config.html" class="botao-icone botao-perfil" aria-label="Perfil" type="button" >
                        <i  data-lucide="user" style="width:16px; height:16px; stroke-width:2;"></i>
                    </a>
                </div>
            </div>
        </header>


        <div class="corpo">

            <aside class="barra-lateral">

                <nav class="dentro-lateral">
                    <a href="./home.html" class="opcao">
                        <i data-lucide="layout-dashboard"></i>
                        Inicio
                    </a>

                    <a href="./materias.html" class="opcao ativo">
                        <i data-lucide="book-marked"></i>
                        Matérias
                    </a>

                    <a href="./cronograma.html" class="opcao">
                        <i data-lucide="calendar-range"></i>
                        Cronograma
                    </a>

                    <a href="./metas.html" class="opcao">
                        <i data-lucide="goal"></i>
                        Metas
                    </a>

                    <a href="./desempenho.html" class="opcao">
                        <i data-lucide="chart-spline"></i>
                        Desempenho
                    </a>

                    <a href="./config.html" class="opcao">
                        <i data-lucide="settings"></i>
                        Configurações
                    </a>
                </nav>

            </aside>

            <main class="conteudo">

                <div class="topo-cronograma">
                    <div class="titulo-cronograma">
                        <h1>Matérias</h1>
                        <p class="conteudo-sub">
                            Crie suas matérias aqui.
                        </p>
                    </div>

                    <a class="add-materia" href="">
                        <i data-lucide="plus"></i>
                        Nova matéria
                    </a>
                </div>

                <!-- Os cards são inseridos aqui dinamicamente pelo materias.js -->
                <div class="cards">
                    <p>Carregando matérias...</p>
                </div>

                <div class="cronograma-container">

                    <!-- Dropdown -->
                    <div class="cronograma-dropdown">

                        <!-- Cabeçalho -->
                        <div class="dropdown-header">
                            <div class="header-icone">
                                <i data-lucide="calendar-range"></i>
                            </div>
                            <div class="header-textos">
                                <h2>Criação de matérias</h2>
                                <p>Crie seus trabalhos e faça suas atividades.</p>
                            </div>
                            <button class="fechar-btn" aria-label="Fechar">
                                <i data-lucide="x"></i>
                            </button>
                        </div>

                        <!-- Matéria -->
                        <div class="campo">
                            <label for="materia"><i data-lucide="book-open"></i> Nome da Matéria </label>

                            <div class="input-container">
                                <input type="text" id="materia" placeholder="Ex: Matemática">
                            </div>
                        </div>
                        
                        <!-- Professor -->
                        <div class="campo">
                            <label for="professor"><i data-lucide="user-round"></i> Professor</label>

                            <div class="input-container">
                                <input type="text" id="professor" placeholder="Ex: João Silva">
                            </div>
                        </div>

                        <!-- Conteúdo -->
                        <div class="campo">
                            <label for="conteudo"><i data-lucide="file-text"></i> Descrição</label>

                            <textarea id="conteudo" maxlength="150" placeholder="Faça uma simples descrição da matéria."></textarea>
                            <span class="contador">0/150 caracteres</span>
                        </div>

                        <!-- Professor -->
                        

                        <!-- Botão -->
                        <div class="botoes-footer">
                            <button class="criar-btn">
                                <i data-lucide="plus"></i>Criar matéria
                            </button>
                        </div>

                    </div>

                </div>

            </main>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script src="../scripts/materias.js"></script>

</body>

</html>
